<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuitarHub · Library</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">Guitar<span>Hub</span></a>
  <nav><a href="/" class="on">Library</a><a href="/practice.html">Practice</a></nav>
</header>
<main>
  <div class="row" style="justify-content: space-between; margin-bottom: 16px">
    <h1>Library</h1>
    <div class="row">
      <input id="q" type="search" placeholder="Search title, artist, tag…" aria-label="Search" style="width: 280px">
      <button class="primary" id="upload-btn">Upload .gp / .pdf</button>
      <input id="files" type="file" accept=".gp3,.gp4,.gp5,.gpx,.gp,.pdf" multiple hidden>
    </div>
  </div>
  <p id="msg" class="muted"></p>
  <table>
    <thead><tr><th>Title</th><th>Artist</th><th>Tuning</th><th>Tempo</th><th style="width: 34%">Tags</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</main>
<dialog id="pdf-dlg" aria-labelledby="pdf-dlg-h">
  <form method="dialog">
    <h2 id="pdf-dlg-h">Check the converted PDF</h2>
    <div class="row">
      <label>Title <input id="pdf-title" required></label>
      <label>Artist <input id="pdf-artist"></label>
    </div>
    <p id="pdf-summary" class="muted"></p>
    <ul id="pdf-warnings"></ul>
    <div class="at-score" id="pdf-preview"></div>
    <div class="row" style="justify-content: flex-end; margin-top: 12px">
      <button value="cancel" formnovalidate>Skip</button>
      <button value="save" class="primary">Add to library</button>
    </div>
  </form>
</dialog>
<script type="module">
import { alphaTab, tuningLabel, guitarTracks } from '/player.js';
import { pdfToTex } from '/pdftab.js';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const splitTags = s => (s ?? '').split(',').map(t => t.trim()).filter(Boolean);
const TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';

async function load() {
  const tabs = await (await fetch('/api/tabs?q=' + encodeURIComponent($('q').value))).json();
  $('list').innerHTML = tabs.map(t => `
    <tr data-id="${t.id}">
      <td><a href="/tab.html?id=${t.id}">${esc(t.title)}</a></td>
      <td>${esc(t.artist)}</td>
      <td class="muted">${esc(t.tuning)}</td>
      <td class="muted">${t.tempo ?? ''}</td>
      <td class="tags" data-tags="${esc(t.tags)}">${splitTags(t.tags).map(s => `<span class="chip"><button class="tag" title="Show tabs tagged ${esc(s)}">${esc(s)}</button><button class="untag" aria-label="Remove tag ${esc(s)}">×</button></span>`).join('')}<button class="chip add-tag" aria-label="Add tag to ${esc(t.title)}">+ tag</button></td>
      <td><button class="del icon" aria-label="Delete ${esc(t.title)}" title="Delete">${TRASH}</button></td>
    </tr>`).join('') || `<tr><td colspan="6" class="muted">No tabs yet. Upload a Guitar Pro file to start.</td></tr>`;
}

async function saveTags(td, tags) {
  await fetch(`/api/tabs/${td.closest('tr').dataset.id}`, { method: 'PATCH', body: JSON.stringify({ tags: [...new Set(tags)].join(', ') }) });
  load();
}
$('list').addEventListener('click', async e => {
  const btn = e.target.closest('button'), td = e.target.closest('td.tags');
  if (!btn) return;
  if (btn.matches('.tag')) { $('q').value = btn.textContent; return load(); }
  if (btn.matches('.untag')) return saveTags(td, splitTags(td.dataset.tags).filter(t => t !== btn.previousElementSibling.textContent));
  if (btn.matches('.add-tag')) {
    const input = Object.assign(document.createElement('input'), { className: 'tag-input', placeholder: 'tag, tag…' });
    input.setAttribute('aria-label', btn.getAttribute('aria-label'));
    let done = false;
    const commit = () => { if (done) return; done = true; const add = splitTags(input.value); add.length ? saveTags(td, [...splitTags(td.dataset.tags), ...add]) : load(); };
    input.onkeydown = ev => { if (ev.key === 'Enter') commit(); if (ev.key === 'Escape') { done = true; load(); } };
    input.onblur = commit;
    btn.replaceWith(input);
    return input.focus();
  }
  if (btn.matches('.del')) {
    const tr = btn.closest('tr');
    if (!confirm(`Delete "${tr.querySelector('a').textContent}"? This removes the file and its fingering edits.`)) return;
    await fetch(`/api/tabs/${tr.dataset.id}`, { method: 'DELETE' });
    load();
  }
});
let t; $('q').oninput = () => { clearTimeout(t); t = setTimeout(load, 200); };
$('upload-btn').onclick = () => $('files').click();

// Guitar Pro PDF -> alphaTex -> score, then the player checks it and it's stored as a .gp file like any upload
async function fromPdf(file) {
  const pdfjs = await import('/pdfjs/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.mjs';
  const r = await pdfToTex(pdfjs, new Uint8Array(await file.arrayBuffer()), { name: file.name });
  const score = alphaTab.importer.ScoreLoader.loadAlphaTex(r.tex);

  const dlg = $('pdf-dlg');
  $('pdf-title').value = score.title;
  $('pdf-artist').value = score.artist;
  const staff = score.tracks[0].staves[0];
  $('pdf-summary').textContent = `${file.name}: ${score.masterBars.length} bars · ${tuningLabel(staff)} · ${score.tempo} bpm`;
  $('pdf-warnings').innerHTML = r.warnings.map(w => `<li class="error">${esc(w)}</li>`).join('') ||
    '<li class="muted">Every bar adds up. Compare with the PDF before adding it.</li>';
  const api = new alphaTab.AlphaTabApi($('pdf-preview'), {
    core: { fontDirectory: '/vendor/font/' }, display: { layoutMode: 'Page', scale: 0.8 }, player: { playerMode: 'Disabled' },
  });
  api.renderScore(score);
  dlg.returnValue = '';
  dlg.showModal();
  await new Promise(res => dlg.addEventListener('close', res, { once: true }));
  api.destroy();
  $('pdf-preview').innerHTML = '';
  if (dlg.returnValue !== 'save') return null;
  score.title = $('pdf-title').value.trim();
  score.artist = $('pdf-artist').value.trim();
  const bytes = new alphaTab.exporter.Gp7Exporter().export(score, new alphaTab.Settings());
  return { score, bytes, name: `${score.title}.gp` };
}

$('files').onchange = async e => {
  const done = [];
  for (const file of e.target.files) {
    let score, bytes, name = file.name;
    if (/\.pdf$/i.test(file.name)) {
      $('msg').textContent = `Reading ${file.name}…`;
      let r;
      try { r = await fromPdf(file); }
      catch (err) { done.push(`<span class="error">${esc(file.name)}: ${esc(err.message)}</span>`); continue; }
      if (!r) { done.push(`Skipped ${esc(file.name)}`); continue; }
      ({ score, bytes, name } = r);
    } else {
      bytes = new Uint8Array(await file.arrayBuffer());
      try { score = alphaTab.importer.ScoreLoader.loadScoreFromBytes(bytes); }
      catch { done.push(`<span class="error">${esc(file.name)}: not a readable Guitar Pro file</span>`); continue; }
    }
    const guitar = guitarTracks(score)[0];
    const meta = new URLSearchParams({
      name,
      title: score.title || name.replace(/\.\w+$/, ''),
      artist: score.artist || '',
      tuning: guitar ? tuningLabel(guitar.staves[0]) : '',
      tempo: score.tempo,
    });
    const res = await fetch('/api/tabs?' + meta, { method: 'POST', body: bytes });
    done.push(res.ok ? `Added ${esc(meta.get('title'))}` : `<span class="error">${esc(file.name)}: upload failed</span>`);
  }
  $('msg').innerHTML = done.join(' · ');
  e.target.value = '';
  load();
};

load();
</script>
</body>
</html>
