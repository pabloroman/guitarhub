<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuitarHub · Resources</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">Guitar<span>Hub</span></a>
  <nav><a href="/">Library</a><a href="/practice.html">Practice</a><a href="/resources.html" class="on">Resources</a></nav>
</header>
<main>
  <h1>Resources</h1>
  <div class="row" style="margin: 12px 0 16px">
    <button class="toggle" data-tab="keys">Keys and scales</button>
    <button class="toggle" data-tab="finder">Chord finder</button>
    <label class="muted" style="margin-left: auto">Tuning <select id="tuning"></select></label>
  </div>
  <section id="finder" hidden>
    <p class="muted" style="margin-top: 0">Pick a chord to see ways to play it, from the nut up the neck. Click one to hear it.</p>
    <div class="row" style="margin-bottom: 16px">
      <label class="muted">Root <select id="chord-root"></select></label>
      <label class="muted">Chord <select id="chord-type"></select></label>
    </div>
    <h2 id="finder-title"></h2>
    <div id="voicings" class="chords"></div>
  </section>
  <section id="keys">
  <div class="row" style="align-items: start; margin-bottom: 16px">
    <div style="flex: 1; min-width: 260px">
      <p class="muted" style="margin-top: 0">Pick a key to see where the scale sits on the neck and which chords belong to it.</p>
      <div class="row" style="margin-top: 16px">
        <label class="muted">Root <select id="root"></select></label>
        <label class="muted">Scale <select id="scale"></select></label>
      </div>
    </div>
    <div id="circle" class="circle"></div>
  </div>
  <h2 id="neck-title"></h2>
  <div class="panel">
    <div class="row" style="margin-bottom: 8px">
      <button id="prev" class="icon" aria-label="Previous position">‹</button>
      <span id="pos" role="status" style="min-width: 13ch; text-align: center"></span>
      <button id="next" class="icon" aria-label="Next position">›</button>
      <button id="all" class="toggle">Whole neck</button>
      <button id="play" disabled>Play scale</button>
      <button id="degrees" class="toggle" style="margin-left: auto">Degrees</button>
    </div>
    <div id="neck" class="neck"></div>
    <p id="legend" class="row muted" style="justify-content: center; gap: 20px; margin: 8px 0 0"></p>
  </div>
  <h2 id="chords-title"></h2>
  <div id="chords"></div>
  <div class="row" style="margin: 24px 0 10px">
    <h2 id="tab-title" style="margin: 0"></h2>
    <button id="practise">Add to my drills</button>
    <span id="practise-msg" class="muted" role="status"></span>
  </div>
  <div class="player">
    <div class="at-controls"></div>
    <div class="at-score"></div>
  </div>
  </section>
</main>
<script src="/supabase/supabase.js"></script>
<script type="module">
import { db } from '/db.js';
import { alphaTab, createPlayer } from '/player.js';
import { SCALES, CHORD_TYPES, OPEN, TUNINGS, PROGRESSIONS, scale, chord, chords, voicings, positions, scaleTex, chordsTex, tuningName } from '/theory.js';

const $ = id => document.getElementById(id);
const isMinor = notes => notes.some(n => n.degree === 'b3'); // which ring of the circle of fifths a scale belongs to
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const api = createPlayer(document.querySelector('.player'));
const FRETS = 17;
// a chord's notes counted from its own root, for the Degrees labels while a chord is picked
const TONE = { 0: '1', 3: 'b3', 4: '3', 6: 'b5', 7: '5', 8: '#5' };
// what is showing lives in the URL so other pages can link to it; both sections share the root
const params = new URLSearchParams(location.search);
let tab = params.get('tab') === 'finder' ? 'finder' : 'keys';
let root = Math.abs(parseInt(params.get('root')) || 0) % 12;
let name = Object.hasOwn(SCALES, params.get('scale')) ? params.get('scale') : 'Major';
let type = Object.hasOwn(CHORD_TYPES, params.get('type')) ? params.get('type') : 'Major';
// the open strings as MIDI notes, lowest first; a tab links here with its own, which may have no name or more strings
const linked = (params.get('tuning') ?? '').split(',').map(Number);
let tuning = Object.values(TUNINGS).find(t => t.join() === linked.join())
  ?? (linked.length >= 4 && linked.length <= 8 && linked.every(m => Number.isInteger(m) && m >= 12 && m <= 84) ? linked : OPEN);
const tunings = [...new Set([...Object.values(TUNINGS), tuning])];
let label = 'name', pos = null, picked = null; // pos and picked index the scale's positions and chords; null is "all"
let prog = null; // index of the progression in the player; null is the scale

// The player shows the current position, or the chosen progression. Loading takes a moment, so "play" may have to wait for it.
let loaded = '', loading = false, autoplay = false;
function load(tex) {
  if (tex === loaded) return;
  loaded = tex; loading = true;
  $('practise-msg').textContent = '';
  api.stop();
  api.tex(tex);
}
const play = () => { if (loading) autoplay = true; else api.play(); };
api.playerReady.on(() => { loading = false; $('play').disabled = false; if (autoplay) { autoplay = false; api.play(); } });
// a one-chord tab ({ frets, symbol }) that is never shown, only played; not while something else is playing
const strum = chord => { if (api.playerState !== 1) api.playBeat(alphaTab.importer.ScoreLoader.loadAlphaTex(chordsTex(tuning, [chord], 1)).tracks[0].staves[0].bars[0].voices[0].beats[0]); };
const playLabel = () => { $('play').textContent = api.playerState === 1 && prog === null ? 'Pause' : 'Play scale'; };
api.playerStateChanged.on(playLabel);

// one line per string across, five frets down
function chordBox(frets) {
  const fretted = frets.filter(f => f > 0);
  // a shape that doesn't fit in the first five frets is drawn from its lowest fret, labelled instead of a nut
  const base = Math.max(...fretted) <= 5 ? 1 : Math.min(...fretted);
  const x = i => 20 + i * 14, y = j => 24 + j * 18, right = x(frets.length - 1);
  return `<svg viewBox="-8 0 ${right + 36} 120" width="${Math.round((right + 36) * 1.35)}" fill="currentColor">
    <path stroke="currentColor" opacity=".45" d="${frets.map((_, i) => `M${x(i)} ${y(0)}V${y(5)}`).join('')}${[0, 1, 2, 3, 4, 5].map(j => `M${x(0)} ${y(j)}H${right}`).join('')}"/>
    ${base === 1 ? `<path stroke="currentColor" stroke-width="3" d="M${x(0) - .5} ${y(0)}H${right + .5}"/>` : `<text x="${right + 9}" y="${y(.5) + 3}" style="text-anchor: start">${base}fr</text>`}
    ${frets.map((f, i) => f > 0 ? `<circle cx="${x(i)}" cy="${y(f - base + .5)}" r="5.5"/>`
      : `<text x="${x(i)}" y="16" class="${f ? 'error' : ''}">${f ? 'x' : 'o'}</text>`).join('')}
  </svg>`;
}

// The highest string on top like a tab staff, open strings left of the nut.
// dot(string, fret) says what sits there, if anything: { text, root, dim }; string 0 is the lowest of `count`.
function fretboard(title, count, dot) {
  const x = f => f ? 50 + (f - .5) * 60 : 25, y = s => 20 + s * 28, mid = (count - 1) / 2;
  const frets = Array.from({ length: FRETS + 1 }, (_, f) => f), strings = Array.from({ length: count }, (_, s) => s);
  const inlay = (f, s) => `<circle cx="${x(f)}" cy="${y(s)}" r="5" fill="var(--muted)" opacity=".35"/>`;
  return `<svg viewBox="0 0 ${60 + FRETS * 60} ${y(count - 1) + 35}" role="img" aria-label="${title}">
    ${[3, 5, 7, 9, 15, 17].map(f => inlay(f, mid)).join('')}${inlay(12, mid - 1)}${inlay(12, mid + 1)}
    <path stroke="var(--muted)" opacity=".6" d="${strings.map(s => `M8 ${y(s)}H${52 + FRETS * 60}`).join('')}"/>
    <path stroke="var(--muted)" stroke-width="2" d="${frets.map(f => `M${50 + f * 60} ${y(0)}V${y(count - 1)}`).join('')}"/>
    <path stroke="var(--text)" stroke-width="5" d="M50 ${y(0)}V${y(count - 1)}"/>
    ${strings.flatMap(s => frets.map(f => {
      const d = dot(count - 1 - s, f);
      return d ? `<g opacity="${d.dim ? .22 : 1}"><circle cx="${x(f)}" cy="${y(s)}" r="11" fill="var(--${d.root ? 'accent' : 'ok'})"/>
        <text x="${x(f)}" y="${y(s) + 4}" class="note">${d.text}</text></g>` : '';
    })).join('')}
    ${frets.map(f => `<text x="${x(f)}" y="${y(count - 1) + 28}">${f}</text>`).join('')}
  </svg>`;
}

// Circle of fifths: major keys outside, their relative minors inside, each a fifth above the one before it.
// The current key is filled and the keys either side of it, which share all but one note, are tinted.
function circle(minor) {
  const pt = (r, deg) => [Math.cos, Math.sin].map(f => (r * f(deg * Math.PI / 180)).toFixed(1));
  const ring = (r0, r1, inner) => Array.from({ length: 12 }, (_, i) => {
    const pc = (i * 7 + (inner ? 9 : 0)) % 12, a = i * 30 - 105, at = inner === minor && (pc - root + 12) % 12;
    const key = scale(pc, inner ? 'Minor' : 'Major')[0].name, [x, y] = pt((r0 + r1) / 2, a + 15);
    return `<path d="M${pt(r1, a)}A${r1} ${r1} 0 0 1 ${pt(r1, a + 30)}L${pt(r0, a + 30)}A${r0} ${r0} 0 0 0 ${pt(r0, a)}Z" class="${at === 0 ? 'on' : at === 5 || at === 7 ? 'near' : ''}"
      data-pc="${pc}" data-scale="${inner ? 'Minor' : 'Major'}" role="button" tabindex="0" aria-pressed="${at === 0}" aria-label="${key} ${inner ? 'minor' : 'major'}"/>
      <text x="${x}" y="${+y + 4}" style="font-size: ${inner ? 10 : 12}px">${key}${inner ? 'm' : ''}</text>`;
  }).join('');
  return `<svg viewBox="-100 -100 200 200" width="190" role="group" aria-label="Circle of fifths">${ring(64, 98, false)}${ring(34, 64, true)}</svg>`;
}

function render() {
  const notes = scale(root, name), key = `${notes[0].name} ${name}`, list = chords(root, name, tuning), boxes = positions(tuning, notes, FRETS);
  if (pos >= boxes.length) pos = null;
  const box = boxes[pos], pickedChord = list[picked]; // undefined when showing everything
  // progressions for keys whose tonic chord is major, or minor; none for scales without chords
  const sets = list.length ? PROGRESSIONS[list[0].quality === 'Major' ? 'Major' : 'Minor'] : [];
  const progName = p => p.name ?? p.degrees.map(i => list[i].numeral).join(' – ');
  history.replaceState(null, '', `?${new URLSearchParams({ ...(tab === 'finder' ? { tab, root, type } : { root, scale: name }), ...(tuning !== OPEN && { tuning }) })}`);
  for (const b of document.querySelectorAll('[data-tab]')) b.setAttribute('aria-pressed', b.dataset.tab === tab);
  $('keys').hidden = tab !== 'keys';
  $('finder').hidden = tab !== 'finder';

  const tones = chord(root, type), symbol = tones[0].name + CHORD_TYPES[type].symbol, text = frets => frets.map(f => f < 0 ? 'x' : f).join(' ');
  $('chord-root').innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === root ? 'selected' : ''}>${chord(i, type)[0].name}</option>`).join('');
  $('finder-title').textContent = `${symbol} · ${tones.map(n => n.name).join(' ')}`;
  $('voicings').innerHTML = voicings(tuning, root, type).map(frets => `<button class="card" data-frets="${frets}" data-symbol="${symbol}" aria-label="${symbol}: ${text(frets)}">
      ${chordBox(frets)}<span class="muted">${text(frets)}</span>
    </button>`).join('');

  // a root is written differently from scale to scale: Db major, C# minor
  $('root').innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === root ? 'selected' : ''}>${scale(i, name)[0].name}</option>`).join('');

  $('circle').innerHTML = circle(isMinor(notes));

  $('neck-title').textContent = pickedChord ? `${pickedChord.name} ${pickedChord.quality} in ${key}` : key;
  $('pos').textContent = box ? `Position ${pos + 1} of ${boxes.length}` : 'All positions';
  $('all').setAttribute('aria-pressed', !box);
  $('degrees').setAttribute('aria-pressed', label === 'degree');
  $('neck').innerHTML = fretboard(`${$('neck-title').textContent} on the fretboard: ${(pickedChord ? notes.filter(n => pickedChord.notes.includes(n.pc)) : notes).map(n => n.name).join(' ')}`, tuning.length, (string, fret) => {
    const n = notes.find(n => n.pc === (tuning[string] + fret) % 12);
    if (!n) return;
    const tone = pickedChord && TONE[(n.pc - pickedChord.root + 12) % 12];
    return { root: n.pc === (pickedChord ? pickedChord.root : root), text: label === 'name' ? n.name : pickedChord ? tone ?? '' : n.degree,
      dim: (pickedChord && !pickedChord.notes.includes(n.pc)) || (box && !box.some(b => b.string === string && b.fret === fret)) };
  });
  // on a narrow screen the neck scrolls sideways: bring the position into view
  if (box) $('neck').scrollLeft = (Math.min(...box.map(b => b.fret)) * 60 - 20) / (60 + FRETS * 60) * $('neck').scrollWidth;
  $('legend').innerHTML =`<span><span style="color: var(--accent)">●</span> ${pickedChord ? 'Chord root' : 'Root note'}</span><span><span style="color: var(--ok)">●</span> ${pickedChord ? 'Chord note' : 'Scale note'}</span>`;

  $('chords-title').textContent = `Chords in ${key}`;
  $('chords').innerHTML = list.length ? `<div class="chords">${list.map((c, i) => `<button class="card" data-chord="${i}" aria-pressed="${i === picked}" aria-label="${c.numeral}, ${c.name} ${c.quality}: ${text(c.frets)}">
      <span class="muted">${c.numeral}</span>
      <b>${c.name} <span class="muted">${c.quality}</span></b>${chordBox(c.frets)}
    </button>`).join('')}</div>
    <p class="muted">Pick a chord to hear it and see its notes on the neck, or play along with a progression:</p>
    <div class="row">${sets.map((p, i) => `<button class="toggle" data-prog="${i}" aria-pressed="${i === prog}">${progName(p)}</button>`).join('')}</div>`
    : `<p class="muted">Chords are built by stacking thirds on a seven-note scale, and ${name} has ${notes.length} notes.</p>`;

  $('tab-title').textContent = sets[prog] ? `${progName(sets[prog])} in ${key}` : `${key}, position ${(pos ?? 0) + 1}`;
  playLabel();
  load(sets[prog] ? chordsTex(tuning, sets[prog].degrees.map(i => list[i])) : scaleTex(tuning, box ?? boxes[0]));
}

$('scale').innerHTML = Object.keys(SCALES).map(s => `<option ${s === name ? 'selected' : ''}>${s}</option>`).join('');
$('chord-type').innerHTML = Object.keys(CHORD_TYPES).map(t => `<option ${t === type ? 'selected' : ''}>${t}</option>`).join('');
for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => { tab = b.dataset.tab; render(); };
$('tuning').innerHTML = tunings.map(t => `<option ${t === tuning ? 'selected' : ''}>${tuningName(t)}</option>`).join('');
$('tuning').onchange = e => { tuning = tunings[e.target.selectedIndex]; picked = null; render(); };
$('chord-type').onchange = e => { type = e.target.value; render(); };
$('voicings').onclick = e => { const v = e.target.closest('[data-frets]'); if (v) strum({ frets: v.dataset.frets.split(',').map(Number), symbol: v.dataset.symbol }); };
$('root').onchange = $('chord-root').onchange = e => { root = +e.target.value; picked = null; render(); };
$('scale').onchange = e => { name = e.target.value; picked = prog = null; render(); };
$('play').onclick = () => {
  if (api.playerState === 1 && prog === null) return api.pause();
  prog = null; render(); play();
};
$('degrees').onclick = () => { label = label === 'name' ? 'degree' : 'name'; render(); };
$('all').onclick = () => { pos = null; render(); };
const step = by => () => { const n = positions(tuning, scale(root, name), FRETS).length; pos = pos === null ? (by > 0 ? 0 : n - 1) : (pos + by + n) % n; render(); };
$('prev').onclick = step(-1);
$('next').onclick = step(1);
// a wedge sets the root; the scale only changes when you cross between the major and minor rings (A minor pentatonic -> E minor pentatonic)
const pickKey = e => {
  const w = e.target.closest('[data-pc]');
  if (!w || (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  root = +w.dataset.pc; picked = null;
  if (isMinor(scale(root, name)) !== (w.dataset.scale === 'Minor')) { name = $('scale').value = w.dataset.scale; prog = null; }
  render();
  $('circle').querySelector('.on').focus(); // render replaced the wedge that had focus
};
$('circle').onclick = $('circle').onkeydown = pickKey;

// what the player is showing becomes a drill on the Practice page, with the same tempo ladder as the built-in ones
$('practise').onclick = async () => {
  const scaleRun = prog === null;
  const { error } = await db.from('exercises').upsert({
    title: $('tab-title').textContent, technique: scaleRun ? 'Scale' : 'Chord changes', alphatex: loaded,
    goal: scaleRun ? 'Even 8th notes up and back down, every note the same length and volume.' : 'Change chords in time without stopping the strumming hand.',
    start_bpm: 60, target_bpm: 120, current_bpm: 60, drill: `resources:${root}:${name}:${scaleRun ? `position${pos ?? 0}` : `progression${prog}`}${tuning === OPEN ? '' : `:${tuning}`}`, level: 0,
  }, { onConflict: 'user_id,drill,level', ignoreDuplicates: true }); // adding it twice keeps the first one and its progress
  $('practise-msg').innerHTML = error ? `<span class="error">Could not add it: ${esc(error.message)}</span>` : 'It\'s in your drills. <a href="/practice.html">Open Practice →</a>';
};

$('chords').onclick = e => {
  const c = e.target.closest('[data-chord]'), p = e.target.closest('[data-prog]');
  if (c) {
    picked = picked === +c.dataset.chord ? null : +c.dataset.chord;
    if (picked !== null) strum(chords(root, name, tuning)[picked]);
  }
  if (p) {
    prog = prog === +p.dataset.prog ? null : +p.dataset.prog;
    if (prog === null) api.stop(); else api.setLooping(true);
  }
  if (c || p) render();
  if (p && prog !== null) play();
};
render();
</script>
</body>
</html>
