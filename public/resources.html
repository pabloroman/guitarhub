<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuitarHub · Resources</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">Guitar<span>Hub</span></a>
  <nav><a href="/">Library</a><a href="/practice.html">Practice</a><a href="/resources.html" class="on">Resources</a></nav>
</header>
<main>
  <h1>Resources</h1>
  <p class="muted" style="margin-top: 0">Pick a key to see its chords and where the scale sits on the neck.</p>
  <div class="row" style="margin: 16px 0">
    <label class="muted">Root <select id="root"></select></label>
    <label class="muted">Scale <select id="scale"></select></label>
    <span class="row" style="margin-left: auto">
      <button id="degrees" class="toggle" aria-pressed="false">Degrees</button>
      <button class="toggle" data-view="chords">Chords</button>
      <button class="toggle" data-view="fretboard">Fretboard</button>
    </span>
  </div>
  <h2 id="title"></h2>
  <div id="view"></div>
</main>
<script src="/supabase/supabase.js"></script>
<script type="module">
import '/db.js'; // sign-in gate and the Sign out button
import { SCALES, OPEN, scale, chords } from '/theory.js';

const $ = id => document.getElementById(id);
const toggles = document.querySelectorAll('[data-view]');
// the key lives in the URL so other pages can link to one
const params = new URLSearchParams(location.search);
let root = Math.abs(parseInt(params.get('root')) || 0) % 12;
let name = Object.hasOwn(SCALES, params.get('scale')) ? params.get('scale') : 'Major';
let view = 'chords', label = 'name';

// six strings across, five frets down
function chordBox(frets) {
  const fretted = frets.filter(f => f > 0);
  // a shape that doesn't fit in the first five frets is drawn from its lowest fret, labelled instead of a nut
  const base = Math.max(...fretted) <= 5 ? 1 : Math.min(...fretted);
  const x = i => 20 + i * 14, y = j => 24 + j * 18;
  return `<svg viewBox="-8 0 126 120" width="170" fill="currentColor">
    <path stroke="currentColor" opacity=".45" d="${[0, 1, 2, 3, 4, 5].map(i => `M${x(i)} ${y(0)}V${y(5)}M${x(0)} ${y(i)}H${x(5)}`).join('')}"/>
    ${base === 1 ? `<path stroke="currentColor" stroke-width="3" d="M${x(0) - .5} ${y(0)}H${x(5) + .5}"/>` : `<text x="99" y="${y(.5) + 3}" style="text-anchor: start">${base}fr</text>`}
    ${frets.map((f, i) => f > 0 ? `<circle cx="${x(i)}" cy="${y(f - base + .5)}" r="5.5"/>`
      : `<text x="${x(i)}" y="16" class="${f ? 'error' : ''}">${f ? 'x' : 'o'}</text>`).join('')}
  </svg>`;
}

// high E on top like a tab staff, open strings left of the nut; `notes` is the scale, root first
function fretboard(notes, title) {
  const x = f => f ? 50 + (f - .5) * 60 : 25, y = s => 20 + s * 28;
  const frets = Array.from({ length: 14 }, (_, f) => f), strings = [0, 1, 2, 3, 4, 5];
  const inlay = (f, s) => `<circle cx="${x(f)}" cy="${y(s)}" r="5" fill="var(--muted)" opacity=".35"/>`;
  return `<svg viewBox="0 0 840 195" role="img" aria-label="${title} on the fretboard: ${notes.map(n => n.name).join(' ')}">
    ${[3, 5, 7, 9].map(f => inlay(f, 2.5)).join('')}${inlay(12, 1.5)}${inlay(12, 3.5)}
    <path stroke="var(--muted)" opacity=".6" d="${strings.map(s => `M8 ${y(s)}H832`).join('')}"/>
    <path stroke="var(--muted)" stroke-width="2" d="${frets.map(f => `M${50 + f * 60} ${y(0)}V${y(5)}`).join('')}"/>
    <path stroke="var(--text)" stroke-width="5" d="M50 ${y(0)}V${y(5)}"/>
    ${strings.flatMap(s => frets.map(f => {
      const n = notes.find(n => n.pc === (OPEN[5 - s] + f) % 12);
      return n ? `<circle cx="${x(f)}" cy="${y(s)}" r="11" fill="var(--${n === notes[0] ? 'accent' : 'ok'})"/>
        <text x="${x(f)}" y="${y(s) + 4}" class="note">${n[label]}</text>` : '';
    })).join('')}
    ${frets.map(f => `<text x="${x(f)}" y="188">${f}</text>`).join('')}
  </svg>`;
}

function render() {
  const notes = scale(root, name), key = `${notes[0].name} ${name}`, list = chords(root, name);
  history.replaceState(null, '', `?${new URLSearchParams({ root, scale: name })}`);
  // a root is written differently from scale to scale: Db major, C# minor
  $('root').innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i}" ${i === root ? 'selected' : ''}>${scale(i, name)[0].name}</option>`).join('');
  for (const b of toggles) b.setAttribute('aria-pressed', b.dataset.view === view);
  $('degrees').hidden = view === 'chords';
  $('degrees').setAttribute('aria-pressed', label === 'degree');
  $('title').textContent = view === 'chords' ? `Chords in ${key}` : `Scale on fretboard: ${key}`;
  $('view').innerHTML = view === 'fretboard'
    ? `<div class="panel neck">${fretboard(notes, key)}</div>
      <p class="row muted" style="justify-content: center; gap: 20px"><span><span style="color: var(--accent)">●</span> Root note</span><span><span style="color: var(--ok)">●</span> Scale note</span></p>`
    : list.length ? `<div class="chords">${list.map(c => `<div class="panel" role="img" aria-label="${c.numeral}, ${c.name} ${c.quality}: ${c.frets.map(f => f < 0 ? 'x' : f).join(' ')}">
        <div class="muted">${c.numeral}</div>
        <h3>${c.name} <span class="muted">${c.quality}</span></h3>${chordBox(c.frets)}
      </div>`).join('')}</div>`
    : `<p class="muted">Chords are built by stacking thirds on a seven-note scale, and ${name} has ${notes.length} notes.</p>`;
}

$('scale').innerHTML = Object.keys(SCALES).map(s => `<option ${s === name ? 'selected' : ''}>${s}</option>`).join('');
$('root').onchange = e => { root = +e.target.value; render(); };
$('scale').onchange = e => { name = e.target.value; render(); };
$('degrees').onclick = () => { label = label === 'name' ? 'degree' : 'name'; render(); };
for (const b of toggles) b.onclick = () => { view = b.dataset.view; render(); };
render();
</script>
</body>
</html>
